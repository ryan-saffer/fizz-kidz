name: Deploy

on:
    push:
        branches: [develop, main]
        paths:
            - 'apps/portal/**'
            - 'apps/server/**'
            - 'apps/sanity-studio/**'
            - 'apps/website/**'
            - 'packages/core/**'
            - 'packages/ui/**'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.ts'
            - 'oxfmt.config.ts'
            - 'tsconfig.json'
            - '.node-version'
            - 'firebase.json'
            - '.firebaserc'
            - 'apps/portal/predeploy.sh'
            - '.github/deploy-netlify.sh'
            - '.github/workflows/pipeline.yml'

    # Manual trigger from the Actions tab
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        # Use GitHub Environments so env-scoped secrets/approvals apply
        # Map branches to environments
        environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        permissions:
            contents: read

        env:
            # Only deploy to prod on pushes to main. All other contexts (PRs, manual PR runs,
            # pushes to develop, manual branch refs) deploy to dev.
            PROJECT_ID: ${{ github.ref_name == 'main' && 'bookings-prod' || 'booking-system-6435d' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # Keep full commit metadata for paths-filter without downloading
                  # historical file contents that this deployment never reads.
                  filter: blob:none

            # Pushes deploy only affected targets. Manual runs intentionally deploy every
            # target available for the selected branch as a full recovery deployment.
            - name: Detect deployment targets
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  base: ${{ github.ref }}
                  filters: |
                      portal:
                        - 'apps/portal/**'
                        - 'packages/core/**'
                        - 'packages/ui/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'vite.config.ts'
                        - 'tsconfig.json'
                        - '.node-version'
                        - 'firebase.json'
                        - '.firebaserc'
                        - 'apps/portal/predeploy.sh'
                      server:
                        - 'apps/server/**'
                        - 'packages/core/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'vite.config.ts'
                        - 'tsconfig.json'
                        - '.node-version'
                        - 'firebase.json'
                        - '.firebaserc'
                      website:
                        - 'apps/website/**'
                        - 'packages/core/**'
                        - 'packages/ui/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - '.node-version'
                        - '.github/deploy-netlify.sh'
                      sanity:
                        - 'apps/sanity-studio/**'
                        - 'packages/core/**'
                        - 'packages/ui/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - '.node-version'

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  version-file: package.json
                  node-version-file: '.node-version'
                  cache: true
                  cache-dependency-path: package-lock.json
                  run-install: false

            - name: Cache installed dependencies
              id: cache-installed-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      apps/portal/node_modules
                      apps/docs/node_modules
                      apps/sanity-studio/node_modules
                      apps/server/node_modules
                      apps/website/node_modules
                      packages/core/node_modules
                      packages/ui/node_modules
                  key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package.json', 'package-lock.json') }}

            - name: Create server .env from SERVER_ENV_FILE
              if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.server == 'true'
              env:
                  SERVER_ENV_FILE: ${{ vars.SERVER_ENV_FILE }}
              run: |
                  if [ "${{ github.ref_name }}" = 'main' ]; then
                    printf '%s' "$SERVER_ENV_FILE" > apps/server/.env.prod
                    printf '%s' "$SERVER_ENV_FILE" > apps/server/.env.bookings-prod
                    echo "Wrote server prod env files"
                  else
                    printf '%s' "$SERVER_ENV_FILE" > apps/server/.env
                    printf '%s' "$SERVER_ENV_FILE" > apps/server/.env.booking-system-6435d
                    echo "Wrote server dev env files"
                  fi

            - name: Create portal .env from PORTAL_ENV_FILE
              if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.portal == 'true'
              env:
                  PORTAL_ENV_FILE: ${{ vars.PORTAL_ENV_FILE }}
              run: |
                  if [ "${{ github.ref_name }}" = 'main' ]; then
                    printf '%s' "$PORTAL_ENV_FILE" > apps/portal/.env.prod
                    echo "Wrote apps/portal/.env.prod"
                  else
                    printf '%s' "$PORTAL_ENV_FILE" > apps/portal/.env
                    echo "Wrote apps/portal/.env"
                  fi

            - name: Install dependencies
              if: steps.cache-installed-dependencies.outputs.cache-hit != 'true'
              run: vp install --frozen-lockfile --prefer-offline

            - name: Generate Astro types
              run: |
                  npm --workspace docs exec astro sync
                  npm --workspace website exec astro sync

            - name: Check formatting, lint, and types
              run: vp check

            - name: Run tests
              run: vp test --run

            # Local firebase deploy continues to use the full hooks in firebase.json. CI
            # builds artifacts here, then removes those hooks only from its generated config
            # to avoid rebuilding the same artifacts at deploy.
            - name: Build deployment artifacts
              if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.portal == 'true' || steps.changes.outputs.server == 'true' || steps.changes.outputs.sanity == 'true'
              env:
                  DEPLOY_PORTAL: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.portal == 'true' }}
                  BUILD_SANITY: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.sanity == 'true' }}
                  DEPLOY_SERVER: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.server == 'true' }}
                  GCLOUD_PROJECT: ${{ env.PROJECT_ID }}
              run: |
                  if [ "$DEPLOY_PORTAL" = "true" ]; then
                    sh ./apps/portal/predeploy.sh
                  fi

                  if [ "$DEPLOY_SERVER" = "true" ]; then
                    (cd apps/server && vp pack)
                  fi

                  if [ "$BUILD_SANITY" = "true" ]; then
                    npm run build --workspace sanity-studio
                  fi

            - name: Deploy Firebase targets
              if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.portal == 'true' || steps.changes.outputs.server == 'true'
              env:
                  DEPLOY_PORTAL: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.portal == 'true' }}
                  DEPLOY_SERVER: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.server == 'true' }}
                  GCLOUD_PROJECT: ${{ env.PROJECT_ID }}
                  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
              run: |
                  if [ "$DEPLOY_PORTAL" = "true" ] && [ "$DEPLOY_SERVER" = "true" ]; then
                    targets="functions,hosting"
                  elif [ "$DEPLOY_SERVER" = "true" ]; then
                    targets="functions"
                  elif [ "$DEPLOY_PORTAL" = "true" ]; then
                    targets="hosting"
                  fi

                  # Artifacts were built above. Removing hooks from this generated config
                  # affects CI only; local firebase deploy still runs every predeploy hook.
                  jq 'del(.hosting.predeploy, .functions.predeploy)' firebase.json > firebase.ci.json

                  vp exec firebase deploy \
                    --config firebase.ci.json \
                    --only "$targets" \
                    --project "$PROJECT_ID" \
                    --token "$FIREBASE_TOKEN" \
                    --non-interactive \
                    --force

            - name: Deploy Sanity Studio
              if: success() && github.ref_name == 'main' && (github.event_name == 'workflow_dispatch' || steps.changes.outputs.sanity == 'true')
              env:
                  SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
              run: npm run deploy --workspace sanity-studio -- --no-build --yes --schema-required

            # This remains after Firebase so a failed Firebase deploy prevents the Website
            # from publishing a client that expects the new server contract.
            - name: Trigger and wait for Netlify Website deploy
              if: success() && ((github.event_name == 'push' && steps.changes.outputs.website == 'true') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
                  NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
              run: bash .github/deploy-netlify.sh
