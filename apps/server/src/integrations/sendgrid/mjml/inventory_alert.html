<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                line-height: 1.6;
                color: #2c3e50;
                background-color: #f8f9fa;
                margin: 0;
                padding: 20px;
            }
        </style>
    </head>

    <body>
        <div style="max-width: 600px; margin: 0 auto; background-color: white; border-radius: 12px; overflow: hidden">
            <div style="background: #ac4390; color: white; padding: 24px; text-align: center">
                <h1 style="margin: 0; font-size: 22px; font-weight: 600">{{studio}} inventory needs attention</h1>
            </div>
            <div style="padding: 24px">
                {{#alerts}}
                <div
                    style="border-left: 4px solid #ac4390; padding: 8px 16px; margin-bottom: 16px; background: #fbf4f9"
                >
                    <p style="margin: 0; font-weight: 600">{{title}}</p>
                    <p style="margin: 4px 0 0">{{detail}}</p>
                </div>
                {{/alerts}}
                <p style="margin-top: 24px; font-size: 14px; color: #64748b">
                    Open Inventory in the Fizz Kidz portal to see the stock history for {{studio}}.
                </p>
            </div>
        </div>
    </body>
</html>
